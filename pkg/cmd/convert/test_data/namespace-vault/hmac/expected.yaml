# Source: lighthouse/templates/hmacsecret.yaml
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lighthouse-hmac-token
  labels:
    app: lighthouse-lighthouse
    chart: "lighthouse-0.0.633"
    release: "lighthouse"
    heritage: "Helm"
spec:
  secretStoreRef:
    name: jx-secret-store
    kind: ClusterSecretStore
  data:
  - secretKey: hmac
    remoteRef:
      key: staging/lighthouse/hmac/token
      property: hmac
  target:
    template:
      metadata:
        annotations:
          secret.jenkins-x.io/prefix: staging
        labels:
          app: lighthouse-lighthouse
          chart: "lighthouse-0.0.633"
          release: "lighthouse"
          heritage: "Helm"
      type: Opaque
