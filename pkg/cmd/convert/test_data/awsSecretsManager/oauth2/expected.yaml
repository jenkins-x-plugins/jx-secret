apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: simple-secret
  labels:
    app: lighthouse-lighthouse
    chart: "lighthouse-0.0.633"
    release: "lighthouse"
    heritage: "Helm"
spec:
  secretStoreRef:
    name: jx-secret-store
    kind: ClusterSecretStore
  data:
  - secretKey: azure.json
    remoteRef:
      key: azure-secret-name
      property: azure.json
      version: AWSPREVIOUS
  target:
    template:
      metadata:
        labels:
          app: lighthouse-lighthouse
          chart: "lighthouse-0.0.633"
          release: "lighthouse"
          heritage: "Helm"
      type: Opaque
