apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sonatype
  namespace: jx
spec:
  data:
  - secretKey: password
    remoteRef:
      key: sonatype
      property: password
  - secretKey: username
    remoteRef:
      key: sonatype
      property: username
  secretStoreRef:
    name: jx-secret-store
    kind: ClusterSecretStore
  target:
    template:
      type: Opaque
